  /verify/{token}:
    get:
      tags:
      - Honey Batches
      summary: '**Not under the `/api/v1` base URL** — a plain top-level route: `GET {apiURL}/verify/{token}`
        (`apiURL` is the...'
      description: '**Not under the `/api/v1` base URL** — a plain top-level route: `GET {apiURL}/verify/{token}`
        (`apiURL` is the backend''s own public URL, e.g. `http://localhost:8080/verify/{token}`). Public,
        no authentication, same soft-delete handling as the JSON endpoint above.  This is the exact URL
        encoded in a batch''s QR code and its "verification_url" field — a self-contained, dependency-free
        HTML page (Go `html/template`, no JS, no SPA) so the link opens directly in any browser, including
        one launched straight from a phone''s stock camera app scanning the QR. There is no in-app QR
        scanner or Flutter verification screen; this page is the entire verification experience.  Shows
        honey type, processing method, gathering date, amount, batch ID (the verification token, never
        the internal numeric id), certification status, lab PDF hash, and metadata hash. Once the certification
        is confirmed, also shows the contract address, block number, transaction hash, and a link to the
        Polygon Amoy block explorer (`https://amoy.polygonscan.com/tx/{hash}`).  An intro paragraph above
        the hashes (and a one-line explainer under each) explains what the two hashes are and why the
        live check below matters. Once the certification is confirmed, the page also does a live read
        against the deployed smart contract (bounded by a 5-second timeout so a slow RPC never hangs the
        page) and shows a badge under each hash: "Matches the record on the blockchain" (green) if it
        equals the on-chain value, "Does not match — data may have changed" (red) if it doesn''t, or "Live
        check unavailable right now" (grey) if blockchain isn''t configured on the server or the RPC call
        errors/times out. This live check never causes the page itself to fail — it only affects the badges.  Once
        the certification is confirmed, a "Download lab PDF" button (pointing at the public `GET /verify/{token}/pdf`
        endpoint above) is shown alongside the "View on block explorer" button, in a row at the bottom
        of the proof card.  Bilingual: `?lang=pl` or `?lang=en` query param overrides the language; otherwise
        the `Accept-Language` header is sniffed for `pl`, defaulting to English.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: (or `404 Not Found` if the token doesn't resolve) — `text/html; charset=utf-8`
      security: []
