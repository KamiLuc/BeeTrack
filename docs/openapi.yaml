      tags:
      - Marketplace Listings
      summary: Returns a single listing.
      description: Returns a single listing. Public — auth optional. Hidden listings return `404` unless
        the caller is the owner.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: listing object
        '400':
          description: Path `{id}` is not a valid integer
          content:
            application/json:
              schema: *id001
              examples:
                INVALID_ID:
                  value:
                    code: INVALID_ID
                    message: Path `{id}` is not a valid integer
        '404':
          description: Listing does not exist, or is hidden and caller is not the owner
          content:
            application/json:
              schema: *id001
              examples:
                LISTING_NOT_FOUND:
                  value:
                    code: LISTING_NOT_FOUND
                    message: Listing does not exist, or is hidden and caller is not the owner
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema: *id001
              examples:
                INTERNAL_ERROR:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error
      security: []
    patch:
      tags:
      - Marketplace Listings
      summary: Updates a listing.
      description: Updates a listing. Only the owner can edit. Same body as create; when `image_urls`
        is provided, it replaces the existing images. If the listing was previously `approved`, editing
        resets it back to `pending` admin review.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: updated listing object
        '401':
          description: No Bearer token; Token invalid or expired
          content:
            application/json:
              schema: *id001
              examples:
                MISSING_TOKEN:
                  value:
                    code: MISSING_TOKEN
                    message: No Bearer token
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: Token invalid or expired
        '400':
          description: Path `{id}` is not a valid integer; Malformed JSON; Title field is empty; Category
            not in allowed set; More than 3 `image_urls` given; `title` exceeds 150 characters; `description`
            exceeds 500 characters; `quantity` exceeds 50 characters; `address` exceeds 150 characters;
            `lat`/`lng` missing; `lat` not between -90 and 90, or `lng` not between -180 and 180; `contact_phone`
            exceeds 20 characters; `contact_email` exceeds 150 characters; `price` magnitude is >= 100,000,000;
            `image_urls` given as an empty array, removing all photos; `honey_batch_id` set but `category`
            is not `HONEY`; Batch does not have a confirmed on-chain certification
          content:
            application/json:
              schema: *id001
              examples:
                INVALID_ID:
                  value:
                    code: INVALID_ID
                    message: Path `{id}` is not a valid integer
                INVALID_BODY:
                  value:
                    code: INVALID_BODY
                    message: Malformed JSON
                TITLE_REQUIRED:
                  value:
                    code: TITLE_REQUIRED
                    message: Title field is empty
                CATEGORY_INVALID:
                  value:
                    code: CATEGORY_INVALID
                    message: Category not in allowed set
                TOO_MANY_IMAGES:
                  value:
                    code: TOO_MANY_IMAGES
                    message: More than 3 `image_urls` given
                TITLE_TOO_LONG:
                  value:
                    code: TITLE_TOO_LONG
                    message: '`title` exceeds 150 characters'
                DESCRIPTION_TOO_LONG:
                  value:
                    code: DESCRIPTION_TOO_LONG
                    message: '`description` exceeds 500 characters'
                QUANTITY_TOO_LONG:
                  value:
                    code: QUANTITY_TOO_LONG
                    message: '`quantity` exceeds 50 characters'
                ADDRESS_TOO_LONG:
                  value:
                    code: ADDRESS_TOO_LONG
                    message: '`address` exceeds 150 characters'
                LOCATION_REQUIRED:
                  value:
                    code: LOCATION_REQUIRED
                    message: '`lat`/`lng` missing'
                INVALID_GPS:
                  value:
                    code: INVALID_GPS
                    message: '`lat` not between -90 and 90, or `lng` not between -180 and 180'
                CONTACT_PHONE_TOO_LONG:
                  value:
                    code: CONTACT_PHONE_TOO_LONG
                    message: '`contact_phone` exceeds 20 characters'
                CONTACT_EMAIL_TOO_LONG:
                  value:
                    code: CONTACT_EMAIL_TOO_LONG
                    message: '`contact_email` exceeds 150 characters'
                PRICE_TOO_LARGE:
                  value:
                    code: PRICE_TOO_LARGE
                    message: '`price` magnitude is >= 100,000,000'
                PHOTO_REQUIRED:
                  value:
                    code: PHOTO_REQUIRED
                    message: '`image_urls` given as an empty array, removing all photos'
                HONEY_BATCH_CATEGORY_MISMATCH:
                  value:
                    code: HONEY_BATCH_CATEGORY_MISMATCH
                    message: '`honey_batch_id` set but `category` is not `HONEY`'
                HONEY_BATCH_NOT_CERTIFIED:
                  value:
                    code: HONEY_BATCH_NOT_CERTIFIED
                    message: Batch does not have a confirmed on-chain certification
        '404':
          description: Listing does not exist; `apiary_id` set but caller is not a member of that apiary;
            `honey_batch_id` does not exist or is not owned by the caller
          content:
            application/json:
              schema: *id001
              examples:
                LISTING_NOT_FOUND:
                  value:
                    code: LISTING_NOT_FOUND
                    message: Listing does not exist
                APIARY_NOT_FOUND:
                  value:
                    code: APIARY_NOT_FOUND
                    message: '`apiary_id` set but caller is not a member of that apiary'
                HONEY_BATCH_NOT_FOUND:
                  value:
                    code: HONEY_BATCH_NOT_FOUND
                    message: '`honey_batch_id` does not exist or is not owned by the caller'
        '409':
          description: Batch is already attached to a different listing
          content:
            application/json:
              schema: *id001
              examples:
                HONEY_BATCH_ALREADY_ATTACHED:
                  value:
                    code: HONEY_BATCH_ALREADY_ATTACHED
                    message: Batch is already attached to a different listing
        '403':
          description: Caller is not the listing owner
          content:
            application/json:
              schema: *id001
              examples:
                NOT_OWNER:
                  value:
                    code: NOT_OWNER
                    message: Caller is not the listing owner
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema: *id001
              examples:
                INTERNAL_ERROR:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error
      security:
      - bearerAuth: []
    delete:
      tags:
      - Marketplace Listings
      summary: Deletes a listing.
      description: Deletes a listing. Only the owner can delete. Images cascade.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Success
        '401':
          description: No Bearer token; Token invalid or expired
          content:
            application/json:
              schema: *id001
              examples:
                MISSING_TOKEN:
                  value:
                    code: MISSING_TOKEN
                    message: No Bearer token
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: Token invalid or expired
        '400':
          description: Path `{id}` is not a valid integer
          content:
            application/json:
              schema: *id001
              examples:
                INVALID_ID:
                  value:
                    code: INVALID_ID
                    message: Path `{id}` is not a valid integer
        '404':
          description: Listing does not exist
          content:
            application/json:
              schema: *id001
              examples:
                LISTING_NOT_FOUND:
                  value:
                    code: LISTING_NOT_FOUND
                    message: Listing does not exist
        '403':
          description: Caller is not the listing owner
          content:
            application/json:
              schema: *id001
              examples:
                NOT_OWNER:
                  value:
                    code: NOT_OWNER
                    message: Caller is not the listing owner
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema: *id001
              examples:
                INTERNAL_ERROR:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error
      security:
      - bearerAuth: []
