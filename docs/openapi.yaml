  /api/v1/verify/{token}:
    get:
      tags:
      - Honey Batches
      summary: Public, no authentication.
      description: 'Public, no authentication. Looks up a batch by its public `verification_token` (opaque
        UUID, not the numeric `id`) and returns the batch''s public representation — same fields as the
        honey batch object above, minus the internal numeric `id` and `certification_request` (that state
        is owner-only).  Ignores the batch''s soft-delete status: once a batch has ever been approved
        for on-chain certification, deleting it from the owner''s dashboard only soft-deletes it, so this
        lookup and the HTML page, QR code, and PDF routes below all keep resolving — the on-chain certification
        is immutable and stays publicly verifiable no matter what the owner does on their own dashboard.
        A batch that never reached certification is hard-deleted instead, and genuinely 404s here.'
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  verification_token:
                    type: string
                  verification_url:
                    type: string
                  gathering_date:
                    type: string
                  amount_grams:
                    type: integer
                  processing_method:
                    type: string
                  honey_type:
                    type: string
                  pdf_file_hash:
                    type: string
                  pdf_filename:
                    type: string
                  metadata_hash:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
                  certification:
                    type: string
                    nullable: true
              example:
                verification_token: b2e1c9e0-....-....-....-............
                verification_url: http://localhost:8080/verify/b2e1c9e0-....-....-....-............
                gathering_date: '2026-07-01T00:00:00Z'
                amount_grams: 5000
                processing_method: raw
                honey_type: Wildflower
                pdf_file_hash: b7e2...
                pdf_filename: lab-report.pdf
                metadata_hash: 9f1a...
                created_at: '2026-07-01T10:00:00Z'
                updated_at: '2026-07-01T10:00:00Z'
                certification: null
        '404':
          description: Token does not resolve to a batch
          content:
            application/json:
              schema: *id001
              examples:
                BATCH_NOT_FOUND:
                  value:
                    code: BATCH_NOT_FOUND
                    message: Token does not resolve to a batch
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema: *id001
              examples:
                INTERNAL_ERROR:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error
      security: []
