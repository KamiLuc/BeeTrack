  /api/v1/apiaries/{id}/hives/{hiveId}/position:
    patch:
      tags:
      - Hives
      summary: Moves a hive to a new grid position.
      description: Moves a hive to a new grid position. Both owners and members can move hives. Moving
        to the current position is a no-op.
      parameters:
      - name: id
        in: path
