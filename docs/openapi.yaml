            missing from form; `lab_pdf` content type is not `application/pdf`
          content:
            application/json:
              schema: *id001
              examples:
                INVALID_BODY:
                  value:
                    code: INVALID_BODY
                    message: Malformed multipart form
                INVALID_DATE:
                  value:
                    code: INVALID_DATE
                    message: '`gathering_date` is not `YYYY-MM-DD`'
                INVALID_AMOUNT:
                  value:
                    code: INVALID_AMOUNT
                    message: '`amount_grams` missing/not an integer, or out of range (0 < n ≤ 100,000,000)'
                HONEY_TYPE_REQUIRED:
                  value:
                    code: HONEY_TYPE_REQUIRED
                    message: '`honey_type` is empty'
                HONEY_TYPE_TOO_LONG:
                  value:
                    code: HONEY_TYPE_TOO_LONG
                    message: '`honey_type` exceeds 50 characters'
                INVALID_PROCESSING_METHOD:
                  value:
                    code: INVALID_PROCESSING_METHOD
                    message: '`processing_method` not one of the allowed values'
                MISSING_FILE:
                  value:
                    code: MISSING_FILE
                    message: '`lab_pdf` field missing from form'
                INVALID_PDF_TYPE:
                  value:
                    code: INVALID_PDF_TYPE
                    message: '`lab_pdf` content type is not `application/pdf`'
