  /api/v1/assistant/messages:
    post:
      tags:
      - AI Assistant
      summary: Runs one turn of the AI apiary assistant's agent loop against an OpenRouter chat-completions
        model...
      description: 'Runs one turn of the AI apiary assistant''s agent loop against an OpenRouter chat-completions
        model (`OPENROUTER_MODEL`, default `anthropic/claude-haiku-4.5`). The server owns conversation
        history: pass `conversation_id` to continue an existing conversation, or omit it to start a new
        one — the server loads/persists the message trail (`assistant_conversations`/`assistant_message_logs`/`assistant_tool_calls`).
        Behind the scenes, the model can call the internal MCP tool registry (hive/apiary/marketplace
        read tools) scoped to the caller''s own `userID`, capped at 8 tool-call round trips per request.'
      responses:
        '200':
          description: '`Content-Type: text/event-stream`'
        '401':
          description: No Bearer token in header; Token invalid or expired
          content:
            application/json:
              schema: *id001
              examples:
                MISSING_TOKEN:
                  value:
                    code: MISSING_TOKEN
                    message: No Bearer token in header
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: Token invalid or expired
        '400':
          description: Malformed JSON; `message` is empty
          content:
            application/json:
              schema: *id001
              examples:
                INVALID_BODY:
                  value:
                    code: INVALID_BODY
                    message: Malformed JSON
                EMPTY_MESSAGE:
                  value:
                    code: EMPTY_MESSAGE
                    message: '`message` is empty'
        '404':
          description: '`conversation_id` doesn''t exist or doesn''t belong to the caller'
          content:
            application/json:
              schema: *id001
              examples:
                CONVERSATION_NOT_FOUND:
                  value:
                    code: CONVERSATION_NOT_FOUND
                    message: '`conversation_id` doesn''t exist or doesn''t belong to the caller'
        '403':
          description: Conversation already has 10 logged messages (5 user + 5 assistant turns)
          content:
            application/json:
              schema: *id001
              examples:
                CONVERSATION_LIMIT_REACHED:
                  value:
                    code: CONVERSATION_LIMIT_REACHED
                    message: Conversation already has 10 logged messages (5 user + 5 assistant turns)
      security:
