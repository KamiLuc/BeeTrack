        the client''s ~3-minute recording cap). Each user may have at most 10 recordings awaiting review
        (`pending`/`processing`/`completed`) at a time — accepted, rejected, failed, or cancelled recordings
        don''t count against this limit.  The uploaded file is saved to disk under `AUDIO_STORAGE_PATH`
        and a `voice_recordings` row is inserted with status `pending`. A background worker (only runs
        if `OPENROUTER_API_KEY` is set) polls for `pending` rows, transcribes the audio via OpenRouter''s
        Whisper-compatible transcription endpoint (`OPENROUTER_WHISPER_MODEL`, default `openai/whisper-1`),
        then resolves which hive (if any) of the apiary''s hives the transcript is about. If no hive is
        clearly named, or more than one is, a single `voice_actions` error row is attached (`HIVE_NOT_IDENTIFIED`
        or `MULTIPLE_HIVES_MENTIONED`) and the recording moves straight to `completed`. If exactly one
        hive resolves, the worker makes a second OpenRouter chat-completions call with that hive''s recent
        context and may propose zero or more actions — each recognized action (create inspection, treatment,
        harvest, or feeding) is stored as its own `voice_actions` row with `status = ''proposed''`, unvalidated
        arguments, tied to that hive; naming no actionable activity leaves the recording with zero `voice_actions`
        rows. If that call''s response is cut off by the token limit before finishing, a single `voice_actions`
        error row is attached instead (`PROPOSAL_INCOMPLETE`), same shape as `HIVE_NOT_IDENTIFIED`/`MULTIPLE_HIVES_MENTIONED`.
        Either way the recording then moves to `completed` or `failed` — this endpoint only enqueues the
        recording; reviewing/accepting/rejecting proposed actions is not yet implemented.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '202':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  recording_id:
                    type: integer
                  status:
                    type: string
              example:
                recording_id: 7
                status: pending
        '401':
          description: No Bearer token
          content:
            application/json:
              schema: *id001
              examples:
                MISSING_TOKEN:
                  value:
                    code: MISSING_TOKEN
                    message: No Bearer token
        '400':
          description: Path id is not a valid integer; MIME type not allowed
          content:
            application/json:
              schema: *id001
              examples:
                INVALID_ID:
                  value:
                    code: INVALID_ID
                    message: Path id is not a valid integer
                INVALID_AUDIO_TYPE:
                  value:
                    code: INVALID_AUDIO_TYPE
                    message: MIME type not allowed
        '413':
          description: File exceeds 15 MB
          content:
            application/json:
              schema: *id001
              examples:
                RECORDING_TOO_LONG:
                  value:
                    code: RECORDING_TOO_LONG
                    message: File exceeds 15 MB
        '404':
          description: Apiary does not exist or user is not a member
          content:
            application/json:
              schema: *id001
              examples:
                APIARY_NOT_FOUND:
                  value:
                    code: APIARY_NOT_FOUND
                    message: Apiary does not exist or user is not a member
        '422':
          description: Caller already has 10 recordings awaiting review
          content:
            application/json:
              schema: *id001
              examples:
                MAX_RECORDINGS_REACHED:
                  value:
                    code: MAX_RECORDINGS_REACHED
                    message: Caller already has 10 recordings awaiting review
        '500':
          description: Unexpected server error
          content:
            application/json:
              schema: *id001
              examples:
                INTERNAL_ERROR:
                  value:
                    code: INTERNAL_ERROR
                    message: Unexpected server error
      security:
      - bearerAuth: []
