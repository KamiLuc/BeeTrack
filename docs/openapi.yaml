          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  apiary_id:
                    type: integer
                  name:
                    type: string
                  type:
                    type: string
                  active:
                    type: boolean
                  queen_needs_replacement:
                    type: boolean
                  queen_needs_replacement_since:
                    type: string
                    nullable: true
                  ready_for_harvest:
                    type: boolean
                  ready_for_harvest_since:
                    type: string
                    nullable: true
                  needs_food:
                    type: boolean
                  needs_food_since:
                    type: string
                    nullable: true
                  box_needs_adding:
                    type: boolean
                  box_needs_adding_since:
                    type: string
                    nullable: true
                  frames:
                    type: integer
                  grid_row:
                    type: integer
                  grid_col:
                    type: integer
                  diseases:
                    type: array
                    items: {}
                  last_inspected_at:
                    type: string
                  created_at:
                    type: string
                  updated_at:
                    type: string
              example:
                id: 1
                apiary_id: 1
                name: Hive A
                type: langstroth
                active: true
                queen_needs_replacement: false
                queen_needs_replacement_since: null
                ready_for_harvest: false
                ready_for_harvest_since: null
                needs_food: false
                needs_food_since: null
                box_needs_adding: false
                box_needs_adding_since: null
                frames: 10
                grid_row: 2
                grid_col: 3
                diseases: []
                last_inspected_at: '2026-06-01T10:00:00Z'
                created_at: '2026-06-01T12:00:00Z'
                updated_at: '2026-06-01T13:00:00Z'
        '401':
          description: No Bearer token in header; Token invalid or expired
          content:
            application/json:
              schema: *id001
              examples:
                MISSING_TOKEN:
                  value:
                    code: MISSING_TOKEN
                    message: No Bearer token in header
                INVALID_TOKEN:
                  value:
                    code: INVALID_TOKEN
                    message: Token invalid or expired
        '400':
          description: Path `{id}` or `{hiveId}` is not a valid integer; Malformed JSON; Position is outside
            apiary grid bounds
          content:
            application/json:
              schema: *id001
              examples:
                INVALID_ID:
                  value:
                    code: INVALID_ID
                    message: Path `{id}` or `{hiveId}` is not a valid integer
                INVALID_BODY:
                  value:
                    code: INVALID_BODY
                    message: Malformed JSON
                INVALID_GRID_POSITION:
                  value:
                    code: INVALID_GRID_POSITION
                    message: Position is outside apiary grid bounds
        '404':
          description: Apiary does not exist or user is not a member; Hive does not exist in this apiary
          content:
            application/json:
              schema: *id001
              examples:
                APIARY_NOT_FOUND:
                  value:
                    code: APIARY_NOT_FOUND
                    message: Apiary does not exist or user is not a member
                HIVE_NOT_FOUND:
                  value:
                    code: HIVE_NOT_FOUND
                    message: Hive does not exist in this apiary
        '409':
          description: Another hive already occupies that position
